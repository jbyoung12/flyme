<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flyme</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='36' y2='36' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%231b263b'/%3E%3Cstop offset='100%25' stop-color='%230c1017'/%3E%3C/linearGradient%3E%3ClinearGradient id='jet' x1='18' y1='18' x2='18' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%233d8bff' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='10' fill='url(%23bg)' stroke='%233d8bff' stroke-width='1.5' stroke-opacity='0.55'/%3E%3Cpath d='M10.5 20L8 30h5l1.5-8.5ZM25.5 20L28 30h-5l-1.5-8.5Z' fill='url(%23jet)'/%3E%3Cpath d='M18 6L30 19.5L25.5 22L18 15.2L10.5 22L6 19.5Z' fill='%23ffffff'/%3E%3Cpath d='M18 12.2L24 18.2L18 16.5L12 18.2Z' fill='%233d8bff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: brand + site, step flow, settings -->
    <header id="topbar">
      <div class="tb-left">
        <div class="brand" aria-label="flyme">
          <svg class="brand-logo" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="badgeBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1c273c"/>
                <stop offset="100%" stop-color="#0b0e14"/>
              </linearGradient>
              <linearGradient id="thrusterGlow" x1="18" y1="19" x2="18" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#5ce1ff"/>
                <stop offset="55%" stop-color="#3d8bff" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#3d8bff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="wingShine" x1="6" y1="6" x2="30" y2="23" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#cddbf0"/>
              </linearGradient>
            </defs>
            <!-- Squircle metallic badge frame -->
            <rect x="1" y="1" width="34" height="34" rx="9.5" fill="url(#badgeBg)" stroke="#3d8bff" stroke-opacity="0.5" stroke-width="1.5"/>
            <!-- Twin cold-gas thruster vertical plumes -->
            <path d="M10.5 20.5 L7.5 31.5 H13.5 L15 21.5 Z" fill="url(#thrusterGlow)"/>
            <path d="M25.5 20.5 L28.5 31.5 H22.5 L21 21.5 Z" fill="url(#thrusterGlow)"/>
            <!-- Bold delta flying-car chevron -->
            <path d="M18 5.5 L30.5 19.2 L25.8 22.4 L18 15.4 L10.2 22.4 L5.5 19.2 Z" fill="url(#wingShine)"/>
            <!-- Cockpit canopy facet -->
            <path d="M18 10.5 L23.2 16.5 L18 14.8 L12.8 16.5 Z" fill="#0f1726"/>
          </svg>
          <span class="brand-name">fly<b>me</b></span>
        </div>
        <label class="site-sel" title="Street">
          <select id="site-picker" aria-label="Street"></select>
        </label>
        <div id="pills"></div>
      </div>
      <ol id="steps" aria-label="Progress">
        <li data-step="scan"><span class="num">1</span><span class="lbl">Scan street</span></li>
        <li data-step="pick"><span class="num">2</span><span class="lbl">Pick landing</span></li>
        <li data-step="plan"><span class="num">3</span><span class="lbl">Plan flight</span></li>
        <li data-step="hop"><span class="num">4</span><span class="lbl">Fly</span></li>
      </ol>
      <div class="tb-right">
        <div class="seg mini" id="car-variant" title="Vehicle">
          <button data-car="roadster" class="on" title="Car 1">Car 1</button>
          <button data-car="car2" title="Car 2">Car 2</button>
          <button data-car="car3" title="Car 3">Car 3</button>
        </div>
        <button id="btn-specs" class="tb-btn" title="Vehicle specs">Specs</button>
      </div>
    </header>

    <!-- 3D view (scene.js) — the hero -->
    <main id="view">

      <!-- Camera drawer (cams.js) -->
      <aside id="cams" class="open">
        <button id="cams-toggle" class="cams-head" aria-expanded="true" title="Show / hide cameras">
          <span class="cams-title">Cameras</span>
          <span id="recon-round" class="pill dim">—</span>
          <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <div class="cams-body">
          <div id="tiles"></div>
          <div class="cams-ctl">
            <div class="seg mini" id="cam-mode">
              <button data-mode="footage" class="on">Footage</button>
              <button data-mode="blend">Blend</button>
              <button data-mode="render">Render</button>
            </div>
            <input id="blend" hidden type="range" min="0" max="100" value="50" aria-label="Render opacity" title="Render opacity" />
          </div>
        </div>
      </aside>

      <!-- Driver's-seat POV only: the projected footage smears from outside views. -->
      <div id="view-controls" class="seg mini" title="Camera view">
        <button data-view="pov" title="Back to the street-camera view, where the footage lines up">⟲ Recenter</button>
      </div>

      <!-- Action dock -->
      <div id="dock">
        <div id="hint"></div>
        <div id="target-readout" hidden></div>
        <div class="dock-row">
          <button id="btn-primary" class="primary-btn"><span class="spin"></span><span class="txt">…</span></button>
        </div>
        <div class="dock-sec">
          <button id="btn-newspot" class="sec-btn" title="Clear the landing spot">New spot</button>
          <button id="btn-replan" class="sec-btn" title="Plan again (P)">Plan again</button>
          <button id="btn-video" class="sec-btn" disabled title="Photoreal video of the flight">Photoreal video</button>
        </div>
      </div>
      <div id="scene-look" class="seg mini" title="Street view mode">
        <button data-look="photo" class="on">Footage</button>
        <button data-look="blend">Blend</button>
        <button data-look="model">Render</button>
      </div>
      <div id="lightbox" hidden></div>
    </main>

    <!-- Right: result card + details (panel.js) -->
    <aside id="panel">
      <section id="card" class="card idle">
        <div id="card-kicker" class="kicker">Result</div>
        <div id="plan-banner" class="verdict-big">—</div>
        <div id="why-wrap">
          <p id="why" class="why"></p>
          <button id="why-more" class="link" hidden>more</button>
        </div>
        <div id="progress" hidden></div>
        <div id="activity" hidden></div>
        <div id="keynums" class="keynums"></div>
        <div id="valid-banner" class="valid" hidden>Plan valid ~10 s — rescan before flying</div>
      </section>

      <details id="details">
        <summary><span>Details</span><span class="dim small" id="details-sub">checks · air · flight paths · agent log</span></summary>
        <div class="det-body">
          <section id="arc" class="det-sec">
            <div class="eyebrow">Selected flight path</div>
            <div id="verdict" class="verdict none">No flight path selected</div>
            <div id="arc-title" class="dim"></div>
            <ul id="checklist"></ul>
            <div id="air"></div>
          </section>
          <section id="rounds-wrap" class="det-sec">
            <div class="eyebrow">Flight paths tried <span class="faint">· tap one to replay it</span></div>
            <div id="rounds"></div>
          </section>
          <section id="log-wrap" class="det-sec">
            <div class="eyebrow">Agent log</div>
            <div id="log"></div>
          </section>
        </div>
      </details>

      <section id="street" class="street-card">
        <div class="eyebrow">This street</div>
        <div id="site-name">—</div>
        <div id="status" class="status-line"></div>
        <div id="eval-stat" hidden></div>
      </section>
    </aside>
  </div>

  <div id="specs-pop" hidden></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
